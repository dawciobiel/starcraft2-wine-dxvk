# ===============================================
#  DXVK Configuration (Direct3D → Vulkan layer)
#  https://github.com/doitsujin/dxvk
# ===============================================

# === DXVK Logging ===
DXVK_LOG_PATH="$HOME/Games/battlenet-logs"

# === DXVK Shader State Cache ===
# Cache’owanie skompilowanych shaderów, aby uniknąć przycięć (stutteringu)
DXVK_STATE_CACHE=1
# Domyślna lokalizacja: ~/.cache/dxvk lub $WINEPREFIX/.cache/shader_cache
DXVK_STATE_CACHE_PATH="$HOME/.cache/dxvk_state"

# === DXVK Async Compilation ===
# Włącza asynchroniczną kompilację shaderów (wymaga wersji DXVK-async)
#  DXVK_ASYNC=0 → bezpieczna, standardowa kompilacja
#  DXVK_ASYNC=1 → płynniejsza rozgrywka, mniej stutteringu
DXVK_ASYNC=1

# === DXVK Frame Rate ===
# Ograniczenie liczby klatek (0 = bez limitu)
DXVK_FRAME_RATE=0

# === DXVK Config ===
# Ustawienia przez zmienną środowiskową (zamiast pliku dxvk.conf)
#  dxgi.syncInterval=0 → wyłącza V-Sync
# DXVK_CONFIG="dxgi.syncInterval=0"
DXVK_CONFIG="dxgi.syncInterval=0"

# Wymuś raportowanie ilości pamięci VRAM
DXVK_NVAPI_REPORT_GPU_MEMORY=1

# ===============================================
#  NVIDIA Driver Optimization
# ===============================================

# Włącza buforowanie skompilowanych shaderów na dysku
__GL_SHADER_DISK_CACHE=1
__GL_SHADER_DISK_CACHE_PATH="$HOME/.cache/dxvk_shader"

# Poprawia wydajność sterownika NVIDIA
__GL_THREADED_OPTIMIZATIONS=1

# __GL_SYNC_TO_VBLANK to zmienna środowiskowa sterowników NVIDIA dla OpenGL, która wymusza synchronizację z VBlank (czyli klasyczny VSync). DXVK jednak nie korzysta z OpenGL, tylko z Vulkan, więc ta zmienna nie ma żadnego wpływu na jego działanie.
__GL_SYNC_TO_VBLANK=0

# __GL_YIELD controls how the OpenGL driver yields the CPU when waiting for GPU operations.
# Setting it to "spin" can improve responsiveness and reduce input latency,
# especially in CPU-bound games like StarCraft 2, at the cost of higher CPU usage.
# USLEEP — bardziej energooszczędne, ale może powodować mikroopóźnienia.
# spin — agresywnie utrzymuje wątek aktywny, co może poprawić responsywność i FPS, ale zużywa więcej CPU.
__GL_YIELD="spin"


# ===============================================
#  WINE Performance Tweaks
# ===============================================

# Włącza tryby asynchronicznego przetwarzania wątków
# WINEESYNC i WINEFSYNC redukują narzut CPU
WINEESYNC=1
WINEFSYNC=1

# ===============================================
#  Audio (PulseAudio / PipeWire)
# ===============================================

# Ustawienie opóźnienia dźwięku (niższe = mniejsze lagi audio)
PULSE_LATENCY_MSEC=60

# ===============================================
#  WINE / DXVK Overrides
# ===============================================

# Wymusza użycie Vulkan przez DXVK zamiast OpenGL
# WINEDLLOVERRIDES="d3d9=n,b;dxgi=n,b"
#
#  d3d9=n,b  → użyj natywnego DXVK (native,builtin)
#  dxgi=n,b  → Vulkan backend
#
# n,b = native, builtin, ale z blokadą -> w praktyce Wine ignoruje i blokuje ładowanie tych DLL.
#
# n = native preferowane -> Wine spróbuje załadować natywne biblioteki (czyli DXVK), a jeśli ich nie znajdzie, dopiero fallback do builtin.
#
# Całkowite zakomentowanie -> Wtedy Wine użyje domyślnej logiki: jeśli w prefixie są podmienione DLL (DXVK), to i tak zostaną załadowane.
